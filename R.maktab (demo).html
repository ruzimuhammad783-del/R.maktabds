<!doctype html>
<html lang="uz"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>R.maktab (demo)</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* Layout: blue portal header + nav bar (like the school e-diary), white cards, grade chips.
   Admin: dark sidebar + light work area. Single light theme, all colors set explicitly. */
:root{--blue:#0b6fb8;--blue2:#095a96;--navy:#0c2340;--bg:#eef3f9;--card:#ffffff;--fg:#1b2a3a;--muted:#6b7c93;--line:#dde5ef;--soft:#f5f8fc;--g5:#21a04a;--g4:#7cb342;--g3:#f29a1c;--g2:#e0463c;--ok:#21a04a;--shadow:0 1px 2px rgba(12,35,64,.06),0 6px 16px -8px rgba(12,35,64,.18);--r:12px;--ease-out:cubic-bezier(.2,.7,.2,1);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;padding-block:0}
h1,h2,h3{margin:0 0 .4em;line-height:1.25;text-wrap:balance}
h1{font-size:1.5rem;font-weight:700}h2{font-size:1.15rem;font-weight:700}h3{font-size:1rem;font-weight:700}
p{margin:0 0 .6em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0;transition:transform .25s var(--ease-out),box-shadow .25s var(--ease-out)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.main{max-width:1120px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:6px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;display:inline-block;white-space:nowrap;transition:background .2s,transform .15s var(--ease-out),box-shadow .2s}
button:hover,.btn:hover{background:var(--blue2)}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(11,111,184,.55)}
button:active:not(:disabled){transform:scale(.97);box-shadow:none}
button.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
button.ghost:hover{background:var(--soft)}
button.danger{background:#fff;color:var(--g2);border:1px solid #f1c4c0}
button.danger:hover{background:#fdeeed}
button.danger.armed{background:var(--g2);color:#fff;border-color:var(--g2)}
button.sm{padding:5px 10px;font-size:.82rem;border-radius:6px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #9fd0f5;outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border-radius:8px;border:1px solid #cfd9e6;background:#fff;color:var(--fg);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,111,184,.15);outline:none}
textarea{min-height:84px;resize:vertical}
label.f{display:block;margin-bottom:12px;min-width:0}
label.f>span{display:block;font-size:.82rem;font-weight:600;margin-bottom:4px;color:var(--muted)}
.hdr{background:#fff;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:1.5rem;font-weight:800;color:var(--navy);letter-spacing:-.02em;white-space:nowrap}
.logo b{color:var(--blue)}
.who{display:flex;align-items:center;gap:12px;font-size:.92rem;flex-wrap:wrap;justify-content:flex-end}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7fb8e6,var(--blue));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.navbar{background:var(--blue);display:flex;overflow-x:auto;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.navbar a{color:#fff;text-decoration:none;padding:12px 16px;font-weight:600;font-size:.92rem;white-space:nowrap;border-bottom:3px solid transparent;transition:background .2s,border-color .2s}
.navbar a:hover{background:var(--blue2)}
.navbar a.on{background:var(--blue2);border-bottom-color:#fff}
.subnav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.subnav a,.subnav button{background:none;color:var(--fg);border:0;border-radius:0;padding:12px 14px;text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap;border-bottom:3px solid transparent}
.subnav button:hover{background:var(--soft);color:var(--fg)}
.subnav .on{color:var(--blue);border-bottom-color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#fff;color:var(--fg);border:1px solid var(--line);padding:7px 14px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s var(--ease-out)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:#e7f6ec;color:var(--ok);border-color:#c5e9d1}
.gc{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0 7px;border-radius:6px;color:#fff;font-weight:700;font-size:.9rem;margin:2px 3px 2px 0;border:0;cursor:default}
.gc.g5{background:var(--g5)}.gc.g4{background:var(--g4)}.gc.g3{background:var(--g3)}.gc.g2{background:var(--g2)}
button.gc{cursor:pointer}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--soft)}
.table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:hover td{background:#fafcff}
.scroll{overflow-x:auto}
.avg{font-weight:700;font-size:1rem}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gbtns label{cursor:pointer;position:relative}
.gbtns input{position:absolute;opacity:0;width:1px;height:1px}
.gbtns span{display:inline-flex;align-items:center;justify-content:center;width:52px;height:44px;border-radius:8px;border:2px solid var(--line);font-weight:700;font-size:1.1rem;background:#fff;color:var(--fg);transition:transform .15s var(--ease-out),border-color .2s,box-shadow .2s}
.gbtns label:hover span{transform:translateY(-2px)}
.gbtns label:has(input:checked) span{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.gbtns .g5 span{color:var(--g5)}.gbtns .g4 span{color:var(--g4)}.gbtns .g3 span{color:var(--g3)}.gbtns .g2 span{color:var(--g2)}
.gbtns label:has(input:focus-visible) span{outline:3px solid #9fd0f5}
.lesson-stripe{border-left:4px solid var(--c,var(--blue))}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--blue)}
.hero{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;border-left:5px solid var(--blue)}
.portal{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(180deg,var(--blue) 0 260px,var(--bg) 260px)}
.portal .box{width:100%;max-width:400px;background:#fff;border-radius:16px;box-shadow:0 20px 40px -20px rgba(12,35,64,.4);padding:28px}
.portal .logo{text-align:center;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:90vw;font-size:.92rem;animation:toastIn .35s var(--ease-out) both}
.toast[hidden]{display:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:none}}
.main,.adm-main{animation:rise .5s var(--ease-out) backwards}
.hdr{animation:slideDown .45s var(--ease-out) backwards}
.main .card,.adm-main .card{animation:rise .5s var(--ease-out) backwards}
.portal .box{animation:pop .5s var(--ease-out) backwards}
.card:hover{box-shadow:0 1px 2px rgba(12,35,64,.06),0 14px 28px -14px rgba(12,35,64,.3)}
a.card:hover,.grid .card:hover{transform:translateY(-3px)}
.navbar a{position:relative}
.navbar a::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:#fff;border-radius:3px 3px 0 0;transform:scaleX(0);transition:transform .3s var(--ease-out)}
.navbar a:hover::after{transform:scaleX(1)}
/* admin */
.adm{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--navy);color:#dbe6f3;padding:18px 12px;display:flex;flex-direction:column;gap:14px}
.side .logo{color:#fff;padding:0 8px}.side .logo b{color:#6fb6ef}
.side .logo small{display:block;font-size:.72rem;font-weight:600;color:#8ea6c2;letter-spacing:.08em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{color:#c3d3e6;text-decoration:none;padding:9px 12px;border-radius:8px;font-weight:600;font-size:.92rem;transition:background .2s,color .2s,transform .2s var(--ease-out)}
.side nav a:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(3px)}
.side nav a.on{background:var(--blue);color:#fff}
.side-who{display:flex;align-items:center;gap:10px;text-decoration:none;color:#dbe6f3;padding:8px;border-radius:10px;background:rgba(255,255,255,.06);transition:background .2s,box-shadow .2s}
.side-who:hover{background:rgba(255,255,255,.12)}
.side-who b{font-size:.92rem;color:#fff}
.side-who small{font-size:.74rem;color:#8ea6c2}
.side-who.on{background:rgba(11,111,184,.32);box-shadow:inset 0 0 0 2px var(--blue)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot a{color:#8ea6c2;text-decoration:none;font-size:.9rem;padding:6px 12px}
.side-foot button{background:rgba(255,255,255,.08);color:#fff;border:0}
.adm-main{padding:22px max(18px,env(safe-area-inset-right,0px)) 40px 22px;min-width:0}
.adm-head{margin-bottom:18px}
.adm-head p{color:var(--muted);margin:0}
.stat{padding:16px}
.stat .num{font-size:1.8rem;font-weight:700;color:var(--navy)}
.stat .lbl{color:var(--muted);font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
@media (max-width:860px){
 .adm{grid-template-columns:1fr}
 .side{flex-direction:column;padding:12px 14px;gap:8px}
 .side nav{flex-direction:row;overflow-x:auto}
 .side nav a{white-space:nowrap}
 .side-foot{flex-direction:row;margin-top:0;justify-content:space-between}
 .two{grid-template-columns:1fr}
 .adm-main{padding:16px}
}
@media (max-width:640px){ .hdr{flex-wrap:wrap} .who{width:100%;justify-content:space-between} h1{font-size:1.3rem} }

/* lesson test launcher */
.qz-launch{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding:14px 16px;border:1px dashed #9fd0f5;border-radius:12px;background:#f5faff}
.qz-launch p{margin:4px 0 0}

/* test modal */
.qz-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,24,46,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .3s ease}
.qz-overlay.open{opacity:1}
.qz-card{background:#fff;color:var(--fg);width:100%;max-width:640px;max-height:calc(100vh - 32px);overflow:auto;border-radius:18px;padding:24px;box-shadow:0 30px 60px -20px rgba(8,24,46,.6)}
.qz-card.qz-in{animation:pop .4s var(--ease-out) backwards}
.qz-bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin:14px 0 18px}
.qz-bar span{display:block;height:100%;background:linear-gradient(90deg,#7fb8e6,var(--blue));border-radius:999px;transition:width .5s var(--ease-out)}
.qz-q{font-size:1.2rem;margin:4px 0 16px}
.qz-opts{display:grid;gap:10px}
.qz-opt,.qz-opt:hover{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;font-size:.98rem;white-space:normal;box-shadow:none;transition:border-color .2s,background .2s,transform .2s var(--ease-out)}
.qz-opt:hover:not(:disabled){border-color:#9fd0f5;background:#f5faff;transform:translateX(3px)}
.qz-opt:disabled{opacity:1;cursor:default}
.qz-opt.ok,.qz-opt.ok:hover{border-color:var(--ok);background:#e7f6ec;animation:pulse .5s ease}
.qz-opt.bad,.qz-opt.bad:hover{border-color:var(--g2);background:#fdeeed;animation:shake .4s}
.qz-opt.dim,.qz-opt.dim:hover{opacity:.5}
.qz-letter{flex:0 0 28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);font-size:.85rem;transition:background .2s,color .2s}
.qz-opt.ok .qz-letter{background:var(--ok);color:#fff}
.qz-opt.bad .qz-letter{background:var(--g2);color:#fff}
.qz-card.qz-in .qz-opt{animation:rise .4s var(--ease-out) backwards;animation-delay:calc(var(--k)*60ms)}
.qz-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;min-height:48px;flex-wrap:wrap}
.qz-fb{margin:0;font-weight:700;color:var(--muted)}
.qz-fb.ok{color:var(--ok)}
.qz-fb.bad{color:var(--g2)}
.qz-sum{text-align:center}
.qz-ring{width:150px;height:150px;margin:8px auto 14px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;animation:pop .6s var(--ease-out) backwards}
.qz-ring>div{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qz-ring b{font-size:2.2rem;color:var(--navy);line-height:1}
.qz-ring small{color:var(--muted);font-weight:600}
.qz-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.qz-stats div{background:var(--soft);border-radius:12px;padding:10px}
.qz-stats b{display:block;font-size:1.3rem;color:var(--navy)}
.qz-stats span{font-size:.8rem;color:var(--muted)}
.qz-list{list-style:none;padding:0;margin:0 0 18px;text-align:left;max-height:220px;overflow:auto;display:grid;gap:6px}
.qz-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:.9rem;border:1px solid var(--line)}
.qz-list li.ok{background:#f1faf4;border-color:#c5e9d1}
.qz-list li.bad{background:#fdf3f2;border-color:#f1c4c0}
.qz-list li>span:first-child{font-weight:800;min-width:24px}
.qz-sum .qz-foot{justify-content:center}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}


/* ---------- animatsiyalar ---------- */
@keyframes rmFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rmSlideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes rmPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes rmFlash{0%{background:#fff3c4;box-shadow:inset 4px 0 0 #f59e0b}100%{background:transparent;box-shadow:inset 0 0 0 transparent}}
.main>*,.adm-main>*,.portal .box{animation:rmFadeUp .45s cubic-bezier(.2,.7,.2,1) both}
.table tbody tr{animation:rmFadeUp .35s ease both}
.table tbody tr.fresh{animation:rmFlash 3s ease-out both}
.gc{animation:rmPop .35s cubic-bezier(.2,.7,.2,1) both}
.card{transition:box-shadow .25s ease,transform .25s ease}
button,.btn{transition:transform .15s ease,filter .15s ease,background .2s ease}
button:active,.btn:active{transform:scale(.97)}
button:hover,.btn:hover{filter:brightness(1.05)}
.navbar a,.adm nav a{transition:background .2s ease,color .2s ease}
#toast{animation:rmSlideIn .35s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body><div id="app"></div>
<script>
/* DEMO: Supabase o'rniga xotiradagi server (faqat ko'rsatish uchun) */
window.RM_CONFIG={SUPABASE_URL:'https://demo.local',SUPABASE_ANON_KEY:'demo'};
(function(){
 const ADMIN='5555';
 const store={shared:{},students:[]};
 let nextId=1;
 const err=m=>({data:null,error:{message:m}});
 const ok=d=>({data:d,error:null});
 const copy=x=>JSON.parse(JSON.stringify(x));
 const findByName=n=>store.students.find(s=>s.name_key===String(n||'').trim().toLowerCase());
 const handlers={
  rm_get_shared:()=>ok(copy(store.shared)),
  rm_register:a=>{ const n=String(a.p_name||'').trim(); if(!n||a.p_pass.length<4) return err('BAD_INPUT');
    if(findByName(n)) return err('NAME_TAKEN');
    const s={id:'d'+(nextId++),name:n,name_key:n.toLowerCase(),pass:a.p_pass,data:copy(a.p_data||{})}; store.students.push(s);
    return ok({id:s.id,name:s.name,data:copy(s.data)}); },
  rm_login:a=>{ const s=findByName(a.p_name); if(!s||s.pass!==a.p_pass) return err('BAD_CREDENTIALS'); return ok({id:s.id,name:s.name,data:copy(s.data)}); },
  rm_student_save:a=>{ const s=findByName(a.p_name); if(!s||s.pass!==a.p_pass) return err('BAD_CREDENTIALS'); s.data=copy(a.p_data); return ok(true); },
  rm_admin_load:a=>{ if(a.p_pass!==ADMIN) return err('BAD_ADMIN');
    return ok({shared:copy(store.shared),students:store.students.map(s=>({id:s.id,name:s.name,data:copy(s.data)}))}); },
  rm_admin_save_shared:a=>{ if(a.p_pass!==ADMIN) return err('BAD_ADMIN'); store.shared=copy(a.p_data); return ok(true); },
  rm_admin_save_student:a=>{ if(a.p_pass!==ADMIN) return err('BAD_ADMIN'); const s=store.students.find(x=>x.id===a.p_id); if(s) s.data=copy(a.p_data); return ok(true); },
  rm_admin_update_student:a=>{ if(a.p_pass!==ADMIN) return err('BAD_ADMIN'); const s=store.students.find(x=>x.id===a.p_id);
    const k=String(a.p_name).trim().toLowerCase(); if(store.students.some(x=>x.id!==a.p_id&&x.name_key===k)) return err('NAME_TAKEN');
    s.name=String(a.p_name).trim(); s.name_key=k; if(a.p_new_pass) s.pass=a.p_new_pass; return ok(true); },
  rm_admin_delete_student:a=>{ if(a.p_pass!==ADMIN) return err('BAD_ADMIN'); store.students=store.students.filter(x=>x.id!==a.p_id); return ok(true); },
  rm_admin_set_password:a=>err('BAD_ADMIN')
 };
 window.supabase={createClient:()=>({rpc:async(fn,args)=>{ const h=handlers[fn]; return h?h(args||{}):ok(true); }})};
})();
</script>

/* Umumiy ma'lumot (fanlar, kitoblar, darslar, navbat) hamma uchun bir xil. Har bir o‘quvchining o‘z ma'lumoti alohida. */
const SHARED_KEYS=['startDate','adminName','adminPhoto','subjects','books','sections','lessons','queue','tasks'];
const sharedOf=d=>Object.fromEntries(SHARED_KEYS.map(k=>[k,d[k]]));
const studentDefaults=()=>({pos:0,evalDate:null,dayGrades:{},grades:[],progress:{},quizResults:{},taskDone:{}});
const studentPart=()=>({photo:db.user?.photo||'',pos:db.pos,evalDate:db.evalDate,dayGrades:db.dayGrades,grades:db.grades,progress:db.progress,quizResults:db.quizResults,taskDone:db.taskDone});
let db=Object.assign(seed(),studentDefaults());
let sb=null, session=null, adminStudents=[], ready=false;

const RM_ERRORS={NAME_TAKEN:'Bu ism band. Boshqa ism tanlang.',BAD_CREDENTIALS:'Ism yoki parol noto‘g‘ri',BAD_ADMIN:'Parol noto‘g‘ri',BAD_INPUT:'Ma’lumotni tekshiring (parol kamida 4 ta belgi)'};
function configured(){ const c=window.RM_CONFIG||{}; return !!window.supabase && !!c.SUPABASE_URL && !String(c.SUPABASE_URL).includes('YOUR-'); }
function initServer(){ const c=window.RM_CONFIG; sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY,{auth:{persistSession:false}}); }
async function rpc(fn,args){
 const {data,error}=await sb.rpc(fn,args);
 if(error){ const m=String(error.message||''); const k=Object.keys(RM_ERRORS).find(x=>m.includes(x)); throw new Error(k?RM_ERRORS[k]:'Server bilan aloqa xatosi'); }
 return data;
}
function applyShared(s){ Object.assign(db, Object.keys(s||{}).length ? s : sharedOf(seed())); }
function applyStudent(r){
 const d=Object.assign(studentDefaults(), r.data||{});
 Object.assign(db,{pos:d.pos,evalDate:d.evalDate,dayGrades:d.dayGrades,grades:d.grades,progress:d.progress,quizResults:d.quizResults,taskDone:d.taskDone});
 db.user={id:r.id,name:r.name,photo:d.photo||''};
}
function resetStudentFields(){ Object.assign(db,studentDefaults()); db.user=null; }
function persistSession(){ try{ sessionStorage.setItem('rm-session',JSON.stringify(session)); }catch(e){} }
function clearSession(){ try{ sessionStorage.removeItem('rm-session'); }catch(e){} }
function readSession(){ try{ return JSON.parse(sessionStorage.getItem('rm-session')||'null'); }catch(e){ return null; } }

async function studentLogin(name,pass,register){
 const n=String(name||'').trim(); if(!n) throw new Error('Ismni kiriting');
 const shared=await rpc('rm_get_shared',{});
 const r=register ? await rpc('rm_register',{p_name:n,p_pass:pass,p_data:studentDefaults()}) : await rpc('rm_login',{p_name:n,p_pass:pass});
 applyShared(shared); applyStudent(r);
 session={role:'student',name:r.name,pass}; persistSession();
}
async function adminEnter(pass){
 const r=await rpc('rm_admin_load',{p_pass:pass});
 session={role:'admin',pass}; persistSession();
 applyShared(r.shared); resetStudentFields(); adminStudents=r.students||[];
 if(!r.shared||!Object.keys(r.shared).length) saveDb();
}
async function adminRefresh(){
 const r=await rpc('rm_admin_load',{p_pass:session.pass});
 applyShared(r.shared); adminStudents=r.students||[];
 if(db.user){ const s=adminStudents.find(x=>x.id===db.user.id); if(s) applyStudent(s); else resetStudentFields(); }
}
async function adminPickStudent(id){
 await adminRefresh();
 const s=adminStudents.find(x=>x.id===id); if(!s) throw new Error('O‘quvchi topilmadi');
 applyStudent(s);
}
async function adminEditStudent(id,name,pass){
 await rpc('rm_admin_update_student',{p_pass:session.pass,p_id:id,p_name:String(name||'').trim(),p_new_pass:pass||null});
 await adminRefresh();
}
async function adminDeleteStudent(id){
 await rpc('rm_admin_delete_student',{p_pass:session.pass,p_id:id});
 if(db.user&&db.user.id===id) resetStudentFields();
 await adminRefresh();
}
async function changeAdminPass(oldP,newP){
 await rpc('rm_admin_set_password',{p_old:oldP,p_new:newP});
 session.pass=newP; persistSession();
}
/* Saqlash: admin bo‘lsa umumiy ma'lumot va tanlangan o‘quvchi; o‘quvchi bo‘lsa faqat o‘zining ma'lumoti. */
function saveDb(){
 if(!sb||!session) return;
 const jobs=[];
 if(session.role==='admin'){
  jobs.push(rpc('rm_admin_save_shared',{p_pass:session.pass,p_data:sharedOf(db)}));
  if(db.user) jobs.push(rpc('rm_admin_save_student',{p_pass:session.pass,p_id:db.user.id,p_data:studentPart()}));
 } else {
  jobs.push(rpc('rm_student_save',{p_name:session.name,p_pass:session.pass,p_data:studentPart()}));
 }
 Promise.all(jobs).catch(e=>toast('Saqlanmadi: '+e.message));
}

let qz=null;
const QZ_LETTERS='ABCD';

function quizCardHtml(lessonId){
 const r=db.quizResults[lessonId];
 return `<div class="qz-launch"><div><b>Kitob bo‘yicha test</b><p class="muted small">${QUIZ[lessonId].length} ta savol · natija yakuniy xulosada chiqadi</p>${r?`<span class="pill ok">Oxirgi natija: ${r.score}/${r.total}</span>`:''}</div><button data-act="quiz" data-id="${lessonId}">Testni boshlash</button></div>`;
}

function openQuiz(lessonId){
 const items=QUIZ[lessonId], lesson=lessonOf(lessonId);
 if(!items||!lesson){ toast('Bu dars uchun test hali tayyor emas'); return; }
 qz={id:lessonId,title:lesson.title,items,i:0,picked:null,answers:[],done:false};
 mountQuiz(true);
}

function mountQuiz(fresh){
 let root=document.getElementById('quiz');
 if(!root){
  root=document.createElement('div');
  root.id='quiz';
  root.className='qz-overlay';
  document.body.appendChild(root);
  requestAnimationFrame(()=>root.classList.add('open'));
 }
 root.innerHTML=qz.done?summaryHtml(fresh):questionHtml(fresh);
 if(qz.done&&fresh) countUp(root.querySelector('.qz-count'),qz.answers.filter(Boolean).length);
}

function questionHtml(fresh){
 const n=qz.items.length, it=qz.items[qz.i], p=qz.picked;
 const opts=it.o.map((t,k)=>{
  let cls='';
  if(p!==null) cls=k===it.a?' ok':k===p?' bad':' dim';
  return `<button class="qz-opt${cls}" style="--k:${k}" data-qz="pick" data-k="${k}" ${p!==null?'disabled':''}><span class="qz-letter">${QZ_LETTERS[k]}</span><span>${esc(t)}</span></button>`;
 }).join('');
 const fb=p===null?'Javobni tanlang':p===it.a?'To‘g‘ri javob!':`Noto‘g‘ri. To‘g‘ri javob: ${it.o[it.a]}`;
 const fbCls=p===null?'':p===it.a?' ok':' bad';
 return `<div class="qz-card${fresh?' qz-in':''}" role="dialog" aria-modal="true" aria-labelledby="qzQ">
  <div class="row spread"><span class="pill">Savol ${qz.i+1} / ${n}</span><span class="small muted">${esc(qz.title)}</span></div>
  <div class="qz-bar"><span style="width:${(qz.i/n)*100}%"></span></div>
  <h2 id="qzQ" class="qz-q">${esc(it.q)}</h2>
  <div class="qz-opts">${opts}</div>
  <div class="qz-foot"><p class="qz-fb${fbCls}" aria-live="polite">${fb}</p>${p===null?'':`<button data-qz="next">${qz.i===n-1?'Yakuniy xulosa':'Keyingi savol'}</button>`}</div>
 </div>`;
}

function summaryHtml(fresh){
 const n=qz.items.length, score=qz.answers.filter(Boolean).length, pct=Math.round(score/n*100);
 const verdict=score>=9?'Ajoyib natija! Mavzuni a’lo o‘zlashtirdingiz.':score>=7?'Yaxshi natija. Xatolaringizni ko‘rib chiqing.':score>=5?'Qoniqarli. Mavzuni yana bir bor takrorlang.':'Mavzuni qayta o‘qib, testni yana bir bor ishlang.';
 const list=qz.items.map((it,k)=>`<li class="${qz.answers[k]?'ok':'bad'}"><span>${k+1}</span><span>${esc(it.q)}</span></li>`).join('');
 return `<div class="qz-card qz-sum${fresh?' qz-in':''}" role="dialog" aria-modal="true" aria-labelledby="qzSum">
  <div class="small muted" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700">${esc(qz.title)}</div>
  <h2 id="qzSum" style="font-size:1.4rem;margin-top:4px">Yakuniy xulosa</h2>
  <div class="qz-ring" style="--p:${pct}"><div><b class="qz-count">0</b><small>/ ${n}</small></div></div>
  <p>${verdict}</p>
  <div class="qz-stats"><div><b>${score}</b><span>To‘g‘ri</span></div><div><b>${n-score}</b><span>Noto‘g‘ri</span></div><div><b>${pct}%</b><span>Natija</span></div></div>
  <ul class="qz-list">${list}</ul>
  <div class="qz-foot"><button data-qz="close">Yopish</button></div>
 </div>`;
}

function countUp(el,to){
 if(!el) return;
 const t0=performance.now();
 const step=t=>{ const k=Math.min(1,(t-t0)/900); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); };
 requestAnimationFrame(step);
}

 lp(qz.id).practice=true;

 qz.done=true;

}

/* The test cannot be dismissed until the summary is reached: no close control, Escape and backdrop clicks are ignored. */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-qz]');
 if(!el||!qz) return;
 const a=el.dataset.qz;
 if(a==='pick'&&qz.picked===null){
  const k=Number(el.dataset.k);
  qz.picked=k;
  qz.answers[qz.i]=k===qz.items[qz.i].a;
  mountQuiz(false);
 }
 if(a==='next'){
  if(qz.i<qz.items.length-1){ qz.i++; qz.picked=null; mountQuiz(true); }
  else finishQuiz();
 }
 if(a==='close'&&qz.done){
  document.getElementById('quiz')?.remove();
  qz=null;
  render();
 }
});

 if(parts[0]==='admin'){
  if(!isAdmin()){ app.innerHTML=adminGate(false); return; }
  app.innerHTML=adminView(parts[1]||'dashboard'); return;
 }
 if(!db.user||!isStudent()){ app.innerHTML=authView(); return; }
 app.innerHTML=lessonPageOrHome(parts);
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{ adminEdit=null; render(); });

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el) return;
 const a=el.dataset.act, id=el.dataset.id;
 switch(a){
  case 'pick-student': adminPickStudent(id).then(()=>{ toast('O‘quvchi tanlandi'); location.hash='#/admin/oquvchilar'; render(); }).catch(err=>toast(err.message)); break;
  case 'edit-student': adminEdit={type:'student',id}; render(); break;
  case 'del-student': arm(el,()=>{ adminDeleteStudent(id).then(()=>{ toast('O‘quvchi o‘chirildi'); render(); }).catch(err=>toast(err.message)); }); break;
  case 'photo-del': if(db.user){ delete db.user.photo; saveDb(); toast('Rasm o‘chirildi'); render(); } break;
  case 'admin-photo-del': db.adminPhoto=''; saveDb(); toast('Rasm o‘chirildi'); render(); break;
  case 'logout': logout(); break;
  case 'admin-logout': logout(); break;
  case 'toggle': { const p=lp(id); p[el.dataset.k]=el.checked; saveDb(); if(lessonDone(id)) toast('Dars to‘liq bajarildi'); render(); break; }
  case 'page': sset('page-'+id,el.dataset.k); render(); break;
  case 'page-step': { const cur=sget('page-'+id)||'reading'; const i=PAGES.findIndex(x=>x.k===cur)+Number(el.dataset.d); if(i>=0&&i<PAGES.length){ sset('page-'+id,PAGES[i].k); render(); } break; }
  case 'quiz': openQuiz(id); break;
  case 'task-done': { const t=db.tasks.find(x=>x.id===id); if(t){db.taskDone[id]=true;saveDb();toast('Vazifa bajarildi');render();} break; }
  case 'chorak': sset('chorak',el.dataset.k); render(); break;
  case 'a-chorak': sset('a-chorak',el.dataset.k); render(); break;
  case 'edit-subject': adminEdit={type:'subject',id}; location.hash='#/admin/fanlar'; render(); break;
  case 'del-subject': arm(el,()=>{ const lids=db.lessons.filter(l=>l.subjectId===id).map(l=>l.id); db.subjects=db.subjects.filter(s=>s.id!==id); const bkIds=db.books.filter(b=>b.subjectId===id).map(b=>b.id); db.books=db.books.filter(b=>b.subjectId!==id); db.sections=db.sections.filter(s=>!bkIds.includes(s.bookId)); db.lessons=db.lessons.filter(l=>l.subjectId!==id); db.queue=db.queue.filter(x=>!lids.includes(x)); db.grades=db.grades.filter(g=>g.subjectId!==id); saveDb(); toast('Fan o‘chirildi'); render(); }); break;
  case 'edit-book': adminEdit={type:'book',id}; render(); break;
  case 'del-book': arm(el,()=>{ const sids=db.sections.filter(s=>s.bookId===id).map(s=>s.id); db.books=db.books.filter(b=>b.id!==id); db.sections=db.sections.filter(s=>s.bookId!==id); db.lessons=db.lessons.filter(l=>!sids.includes(l.sectionId)); db.queue=db.queue.filter(x=>lessonOf(x)); saveDb(); toast('Kitob o‘chirildi'); render(); }); break;
  case 'edit-section': adminEdit={type:'section',id}; render(); break;
  case 'del-section': arm(el,()=>{ db.sections=db.sections.filter(s=>s.id!==id); db.lessons=db.lessons.filter(l=>l.sectionId!==id); db.queue=db.queue.filter(x=>lessonOf(x)); saveDb(); toast('Bo‘lim o‘chirildi'); render(); }); break;
  case 'edit-lesson': adminEdit={type:'lesson',id}; location.hash='#/admin/darslar'; render(); break;
  case 'cancel-edit': adminEdit=null; render(); break;
  case 'del-lesson': arm(el,()=>{ db.lessons=db.lessons.filter(l=>l.id!==id); db.queue=db.queue.filter(x=>x!==id); saveDb(); toast('Dars o‘chirildi'); render(); }); break;
  case 'q-add': if(!db.queue.includes(id)){ db.queue.push(id); saveDb(); toast('Navbatga qo‘shildi'); render(); } break;
  case 'q-remove': db.queue.splice(Number(el.dataset.i),1); saveDb(); render(); break;
  case 'q-up': { const i=Number(el.dataset.i); if(i>0){ [db.queue[i-1],db.queue[i]]=[db.queue[i],db.queue[i-1]]; saveDb(); render(); } break; }
  case 'q-down': { const i=Number(el.dataset.i); if(i<db.queue.length-1){ [db.queue[i+1],db.queue[i]]=[db.queue[i],db.queue[i+1]]; saveDb(); render(); } break; }
  case 'del-task': arm(el,()=>{ db.tasks=db.tasks.filter(t=>t.id!==id); saveDb(); render(); }); break;
  case 'del-grade': arm(el,()=>{ db.grades=db.grades.filter(g=>g.id!==id); saveDb(); toast('Baho o‘chirildi'); render(); }); break;
  case 'copy-backup': { const txt=JSON.stringify(db); const done=()=>toast('Nusxa olindi'); const fallback=()=>{ const ta=document.querySelector('[name=json]'); if(ta){ ta.value=txt; ta.select(); } toast('Matn maydonga qo‘yildi — nusxalang'); }; try{ navigator.clipboard.writeText(txt).then(done,fallback);}catch(err){ fallback(); } break; }
  case 'reset-all': arm(el,()=>{ applyShared(sharedOf(seed())); saveDb(); toast('Kontent tiklandi'); render(); }); break;
  case 'template': { const f=el.closest('form'); const sec=sect(f.sectionId.value); if(!sec){toast('Avval sahifa bo‘limini tanlang');break;} const instr=f.instr.value.trim(); f.title.value=f.title.value||sec.topic; f.reading.value=`${pagesText(sec)}: ${sec.topic}.`+(instr?`\nKo‘rsatma: ${instr}`:''); f.writing.value=f.writing.value||'1) [Yozish topshirig‘i]'; f.practice.value=f.practice.value||'1. [Savol]'; toast('Shablon to‘ldirildi'); break; }
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
  if(el.dataset.change==='subj-change'){ const f=el.closest('form'); const secs=db.sections.filter(s=>bookOf(s)?.subjectId===el.value); f.sectionId.innerHTML=sumOpts(secs.map(s=>({id:s.id,label:`${bookOf(s).title}: ${s.from}–${s.to}-bet · ${s.topic}`})),'','Bo‘lim tanlang'); }
});
document.addEventListener('submit',async e=>{
 const f=e.target; if(!f.dataset.form) return; e.preventDefault();
 const fd=new FormData(f), g=k=>String(fd.get(k)||'').trim(), h=f.dataset.form;
 if(h==='register'){ try{ await studentLogin(g('name'),g('pass'),true); toast('Xush kelibsiz!'); location.hash='#/'; render(); }catch(err){ toast(err.message); } return; }
 if(h==='login'){ try{ await studentLogin(g('name'),g('pass'),false); location.hash='#/'; render(); }catch(err){ const er=$('#loginErr'); if(er) er.textContent=err.message; const c=$('.box'); c?.classList.remove('shake'); void c?.offsetWidth; c?.classList.add('shake'); } return; }
 if(h==='admin-profile'){ db.adminName=g('name')||'Administrator'; saveDb(); toast('Profil saqlandi'); render(); return; }
 if(h==='admin-pass'){ if(g('pass')!==g('pass2')){ toast('Yangi parollar mos emas'); return; } try{ await changeAdminPass(g('old'),g('pass')); toast('Administrator paroli o‘zgartirildi'); render(); }catch(err){ toast(err.message); } return; }
 if(h==='student-edit'){ try{ await adminEditStudent(g('id'),g('name'),g('pass')); adminEdit=null; toast('O‘quvchi saqlandi'); render(); }catch(err){ toast(err.message); } return; }
 if(h==='admin-login'){ try{ await adminEnter(g('pass')); location.hash='#/admin/dashboard'; render(); }catch(err){ const p=f.querySelector('p'); if(p) p.textContent=err.message; const c=$('#gate'); c?.classList.remove('shake'); void c?.offsetWidth; c?.classList.add('shake'); } return; }
 if(h==='subject'){ const id=g('id')||uid(); const obj={id,name:g('name'),color:fd.get('color')||'#0b6fb8',desc:g('desc')}; const i=db.subjects.findIndex(s=>s.id===id); if(i>=0) db.subjects[i]=obj; else db.subjects.push(obj); adminEdit=null; saveDb(); toast('Saqlandi'); render(); return; }
 if(h==='book'){ const id=g('id')||uid(); const obj={id,subjectId:g('subjectId'),title:g('title')}; const i=db.books.findIndex(b=>b.id===id); if(i>=0) db.books[i]=obj; else db.books.push(obj); adminEdit=null; saveDb(); toast('Saqlandi'); render(); return; }
 if(h==='section'){ const id=g('id')||uid(); const from=Number(g('from')), to=Number(g('to')); if(to<from){toast('Oxirgi sahifa boshidan kichik bo‘lmasin');return;} const obj={id,bookId:g('bookId'),from,to,topic:g('topic')}; const i=db.sections.findIndex(s=>s.id===id); if(i>=0) db.sections[i]=obj; else db.sections.push(obj); adminEdit=null; saveDb(); toast('Saqlandi'); render(); return; }
 if(h==='lesson'){ const id=g('id')||uid(); const sec=sect(g('sectionId')); if(!sec){toast('Sahifa bo‘limini tanlang');return;} const obj={id,subjectId:bookOf(sec).subjectId,sectionId:sec.id,title:g('title'),reading:String(fd.get('reading')||''),writing:String(fd.get('writing')||''),practice:String(fd.get('practice')||'')}; const i=db.lessons.findIndex(l=>l.id===id); if(i>=0) db.lessons[i]=obj; else db.lessons.push(obj); const inQ=f.queue.checked; db.queue=db.queue.filter(x=>x!==id); if(inQ) db.queue.push(id); adminEdit=null; saveDb(); toast('Dars saqlandi'); render(); return; }
 if(h==='task'){ db.tasks.push({id:uid(),title:g('title'),text:g('text'),subjectId:g('subjectId'),due:g('due'),done:false}); saveDb(); toast('Vazifa qo‘shildi'); render(); return; }
 if(h==='settings'){ db.startDate=g('startDate'); db.evalDate=db.startDate; db.pos=0; db.dayGrades={}; saveDb(); toast('Sana saqlandi, navbat boshidan'); render(); return; }
 if(h==='daygrade'){ if(!db.user){toast('Avval o‘quvchini tanlang');return;} const val=Number(fd.get('value')); if(![2,3,4,5].includes(val)){toast('Bahoni tanlang');return;} const d=g('date')||todayStr(); db.dayGrades[d]=val; saveDb(); toast(`${shortDate(d)} uchun kunlik baho: ${val}`); render(); return; }
 if(h==='grade'){ if(!db.user){toast('Avval o‘quvchini tanlang');return;} const val=Number(fd.get('value')); if(![2,3,4,5].includes(val)){toast('Bahoni tanlang');return;} db.grades.push({id:uid(),subjectId:g('subjectId'),chorak:g('chorak')||'1',value:val,date:g('date')||todayStr(),note:g('note')}); saveDb(); toast(`${val} baho qo‘yildi`); render(); return; }
 });

/* ---------- jonli yangilash (admin: yangi o‘quvchi darhol ko‘rinadi) ---------- */
let freshIds=new Set(), lastSig='', freshTimer=null;
const sigOf=list=>list.map(x=>x.id+'|'+x.name+'|'+((x.data&&x.data.grades)||[]).length).join(';');
async function livePoll(){
 if(!isAdmin()||!ready||adminEdit||!location.hash.startsWith('#/admin/oquvchilar')) return;
 try{
  const r=await rpc('rm_admin_load',{p_pass:session.pass});
  const list=r.students||[]; const sig=sigOf(list);
  if(sig===lastSig) return;
  const prev=new Set(adminStudents.map(x=>x.id));
  const fresh=list.filter(x=>!prev.has(x.id));
  lastSig=sig; adminStudents=list;
  if(db.user){ const s=list.find(x=>x.id===db.user.id); if(s) applyStudent(s); }
  if(fresh.length){
   freshIds=new Set(fresh.map(x=>x.id)); clearTimeout(freshTimer);
   freshTimer=setTimeout(()=>{ freshIds=new Set(); },4000);
   toast('Yangi o‘quvchi: '+fresh.map(x=>x.name).join(', '));
  }
  render();
 }catch(e){}
}
function startLivePoll(){ setInterval(livePoll,4000); }

/* ---------- boot ---------- */
async function boot(){
 if(configured()){
  initServer();
  const saved=readSession();
  if(saved){ try{ if(saved.role==='admin') await adminEnter(saved.pass); else await studentLogin(saved.name,saved.pass,false); }catch(e){ session=null; clearSession(); } }
 }
 if(!location.hash) location.hash='#/';
 ready=true; render();
 startLivePoll();
}
boot();
</script>
